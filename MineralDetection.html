<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Strait of Hormuz Minerals Detection</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eaf4fc; }
    .container {
      max-width: 800px;
      background: #fff;
      border-radius: 17px;
      padding: 30px 20px 25px 20px;
      margin: 34px auto;
      box-shadow: 0 5px 24px #a6bbd140;
      text-align: center;
    }
    h1 { margin-bottom: 11px; color: #1d7ab7; }
    #map-wrap { position: relative; width: 800px; margin: 0 auto 10px auto;}
    #hormuz-map {
      width: 800px; height: 478px; border-radius: 15px;
      box-shadow: 0 2px 12px #2c425214; border: 2px solid #a8cae1;
      background: #e6f0f7;
      margin-bottom: 5px;
      user-select:none;
      cursor: crosshair;
      display: block;
    }
    #pin {
      position: absolute;
      font-size: 2.3em;
      pointer-events: none;
      transform: translate(-58%,-85%);
      display: none;
      z-index: 9;
      text-shadow: 0 2px 4px #2225a033;
    }
    #clue {
      background: #e6f7fa;
      border-radius: 9px;
      margin: 0 auto 13px auto;
      padding: 10px 13px 10px 13px;
      font-size: 1.18em;
      color: #215b77;
      border: 1.5px solid #dbeef2;
      width: fit-content;
      box-shadow: 0 1.4px 9px #bcdbf41b;
    }
    #feedback {
      font-size: 1.3em;
      font-weight: 700;
      margin: 17px 0 9px 0;
      min-height: 42px;
    }
    #coords {
      font-size: 1.14em;
      margin-top: 8px;
      margin-bottom:8px;
      color: #3074b3;
      background:#eaf4fe;
      border-radius: 7px;
      display:inline-block;
      padding: 5px 16px;
      letter-spacing:1px;
      min-width: 247px;
      user-select: text;
    }
    #next-btn, #restart-btn {
      font-size: 1.11em; padding:7.5px 20px; border-radius:9px;
      background: #5bb4ef; color: #fff;
      font-weight:bold; border:0; cursor:pointer; margin-top: 1em;
      box-shadow: 0 2px 9px #abeafd11;
      transition: background .17s;
      margin-left:5px;margin-right:5px;
    }
    #next-btn:hover, #restart-btn:hover{ background: #1794e7;}
    #round-indicator { color:#3264a5; font-size: 1.09em; margin-bottom:6px;}
    @media (max-width:850px){
      #map-wrap, #hormuz-map {width:99vw; height:auto; min-width:0; max-width:99vw;}
    }
    @media (max-width:850px){
      #coords {min-width:80px;}
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Strait of Hormuz: Minerals Detection <span style="font-size:1.06em;">💎</span></h1>
  <div id="round-indicator"></div>
  <div id="clue"></div>
  <div id="map-wrap">
    <img id="hormuz-map" src="Strait of Hormuz.png" alt="Strait of Hormuz Map">
    <span id="pin">📍</span>
  </div>
  <div id="coords">Coordinates: – , –</div>
  <div id="feedback"></div>
  <button id="next-btn" style="display:none;">Next Mine</button>
  <button id="restart-btn" style="display:none;">Restart Game</button>
</div>
<script>
// Based on red boundary of your image #2, core polygon, not enclaves or islands.
const waterPolygon = [
  {x:0.07, y:0.21}, {x:0.085, y:0.14}, {x:0.13, y:0.12}, {x:0.17, y:0.10},
  {x:0.24, y:0.11}, {x:0.26, y:0.09}, {x:0.30, y:0.09}, {x:0.34, y:0.13},
  {x:0.36, y:0.12}, {x:0.38, y:0.09}, {x:0.42, y:0.08}, {x:0.48, y:0.13},
  {x:0.52, y:0.10}, {x:0.59, y:0.13}, {x:0.66, y:0.17}, {x:0.71, y:0.19},
  {x:0.74, y:0.20}, {x:0.78, y:0.16}, {x:0.83, y:0.17}, {x:0.87, y:0.22},
  {x:0.895, y:0.32}, {x:0.92, y:0.35}, {x:0.946, y:0.41}, {x:0.978, y:0.48},
  {x:0.97, y:0.53}, {x:0.93, y:0.62}, {x:0.93, y:0.74}, {x:0.91, y:0.83},
  {x:0.85, y:0.915}, {x:0.77, y:0.92}, {x:0.71, y:0.91}, {x:0.57, y:0.895},
  {x:0.52, y:0.89}, {x:0.41, y:0.86}, {x:0.31, y:0.835}, {x:0.23, y:0.795},
  {x:0.16, y:0.74}, {x:0.12, y:0.68}, {x:0.08, y:0.55}, {x:0.07, y:0.48},
  {x:0.07, y:0.21}
];

// Simple point-in-polygon algorithm
function isInWater(pt, poly = waterPolygon) {
  let x = pt.x, y = pt.y;
  let inside = false;
  for (let i = 0, j = poly.length-1; i < poly.length; j = i++) {
    let xi = poly[i].x, yi = poly[i].y;
    let xj = poly[j].x, yj = poly[j].y;
    let intersect = ((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ========== Game settings ============
const mineral = [
  { location: { x: 0.865, y: 0.37 }, clue: 'Near the eastern exit of the strait, close to Bandar-e-Abbas, Iran.' },
  { location: { x: 0.51, y: 0.93 }, clue: 'Southern end, near Al Fujayrah, by the shipping route.' },
  { location: { x: 0.24, y: 0.12 }, clue: 'Near the northwest corner, close to Ras al Khaimah.' }
];

let round = 0, gameend=false;
const px = id => document.getElementById(id);

function showRound() {
  if (round >= mineral.length) {
    px('clue').style.display='none';
    px('round-indicator').style.display='none';
    px('map-wrap').style.pointerEvents='none';
    px('feedback').innerHTML = `<span style='color:#227a39;font-size:1.18em;'>🎉 You found all the minerals! Strait is safe!</span>`;
    px('next-btn').style.display='none';
    px('restart-btn').style.display='inline-block';
    px('pin').style.display='none';
    px('coords').textContent = "Coordinates: – , –";
    return;
  }
  px('clue').textContent = mineral[round].clue;
  px('clue').style.display='block';
  px('round-indicator').textContent = `Mineral ${round+1} of ${mineral.length}`;
  px('round-indicator').style.display='block';
  px('feedback').innerHTML = "";
  px('pin').style.display='none';
  px('next-btn').style.display='none';
  px('restart-btn').style.display='none';
  px('map-wrap').style.pointerEvents='';
  px('coords').textContent = "Coordinates: – , –";
}

// Returns {x, y} as 0-1 relative to #hormuz-map
function getRelativeCoords(ev) {
  const img = px('hormuz-map');
  const rect = img.getBoundingClientRect();
  let x, y;
  if (ev.touches && ev.touches[0]) {
    x = (ev.touches[0].clientX - rect.left) / img.width;
    y = (ev.touches[0].clientY - rect.top) / img.height;
  } else {
    x = (ev.clientX - rect.left) / img.width;
    y = (ev.clientY - rect.top) / img.height;
  }
  // Clamp to [0,1]
  x = Math.max(0, Math.min(1, x));
  y = Math.max(0, Math.min(1, y));
  return {x, y};
}

function handleMapMove(ev) {
  const {x, y} = getRelativeCoords(ev);
  if(isInWater({x,y})) {
    px('coords').textContent =
      "Coordinates: " +
      x.toFixed(3) + " , " + y.toFixed(3) +
      " (x , y)";
  } else {
    px('coords').textContent = "Not on water";
  }
}
function handleMapLeave(ev) {
  px('coords').textContent = "Coordinates: – , –";
}
function handleMapClick(ev) {
  if (gameend) return;
  const img = px('hormuz-map');
  const {x, y} = getRelativeCoords(ev);
  if(!isInWater({x,y})) {
    px('feedback').innerHTML = "<span style='color:#a72038;'>You can only detect minerals in the water!</span>";
    return;
  }
  dropPin(x, y, img);
  checkMine(x, y);
}

function dropPin(relx, rely, img) {
  const pin = px('pin');
  pin.style.display = 'block';
  pin.style.left = Math.round(img.width*relx) + 'px';
  pin.style.top = Math.round(img.height*rely) + 'px';
}

function checkMineral(x, y) {
  const mineral = mineral[round];
  const dx = x - mineral.location.x, dy = y - mineral.location.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 0.07) {
    px('feedback').innerHTML = "✅ <span style='color:#1a8349;font-size:1.26em;'>You have detected the minerals!</span>";
    px('next-btn').style.display = 'inline-block';
    px('map-wrap').style.pointerEvents='none';
  } else {
    px('feedback').innerHTML = "❌ <span style='color:#a72038;'>No minerals detected here. Try again!</span>";
  }
}

function nextMineral() {
  round += 1;
  showRound();
}

function restartGame() {
  round = 0; gameend=false;
  showRound();
}

const mapImg = px('hormuz-map');
mapImg.onclick = handleMapClick;
mapImg.onmousemove = handleMapMove;
mapImg.onmouseleave = handleMapLeave;
mapImg.ontouchmove = function(ev){handleMapMove(ev);};
mapImg.ontouchend = handleMapLeave;
px('next-btn').onclick = nextMineral;
px('restart-btn').onclick = restartGame;

window.onload = showRound;
</script>
</body>
</html>
